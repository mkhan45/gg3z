<!DOCTYPE html>
<html>
    <head>
        <title> gg3z editor </title>
        <script src="https://pixijs.download/v7.4.2/pixi.js"></script>
        <link rel="stylesheet" href="./editor.css"></link>
    </head>
    <body>
        <a style="font-size: 0.8em" href="https://github.com/mkhan45/gg3z">GitHub</a>
        <div class="container">
            <div class="left-column">
                <textarea id="input"></textarea>
                <div class="controls">
                    <button id="reload">Reload</button>
                    <span id="stages"></span>
                </div>
                <div id="state-vars"></div>
                <div class="controls">
                    <label for="strategy-select">Strategy:</label>
                    <select id="strategy-select">
                        <option value="0">BFS</option>
                        <option value="1">DFS</option>
                    </select>
                    <label for="max-steps-input">Max steps:</label>
                    <input id="max-steps-input" type="number" value="25000" style="width: 80px">
                    <input id="query-input" type="text" value="rect(X, Y, W, H)" style="width: 200px">
                    <button id="query-btn">Query</button>
                    <button id="next-btn" disabled>Next</button>
                    <button id="stop-btn" disabled>Stop</button>
                </div>
                <pre id="output"></pre>
            </div>
            <div class="right-column">
                <div class="controls">
                    <button id="step-btn">Step</button>
                    <button id="run-btn">Run</button>
                    <button id="pause-btn" disabled>Pause</button>
                </div>
                <div id="canvas-container"></div>
                <div id="keys-display">Keys: <span id="keys-list">(none)</span></div>
            </div>
        </div>
        <script type="module">
            const sampleRes = await fetch('./sample.gg3z');
            const sampleCode = await sampleRes.text();
            document.querySelector('#input').value = sampleCode;
        </script>
        <script type="module" src="./editor.js"></script>
    </body>
</html>
